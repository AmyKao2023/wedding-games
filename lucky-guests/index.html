nk)}.empty{color:var(--muted);font-size:17px;line-height:45px}footer{text-align:center;color:#ac939b;font-family:"Microsoft JhengHei","微軟正黑體",sans-serif;font-style:italic;font-size:17px;letter-spacing:2px;padding:28px}.error{color:#a82d51;font-size:16px;min-height:18px;margin:8px 0 0}.petal{position:fixed;top:-25px;z-index:8;pointer-events:none;color:#e7a3b9;animation:fall 2.5s ease-in forwards}@keyframes fall{to{transform:translateY(105vh) rotate(300deg);opacity:0}}button:focus-visible,input:focus-visible{outline:3px solid #b44c6d;outline-offset:4px}.rolling .number{opacity:.65}@media(min-width:1500px){main{padding-top:60px}.number{font-size:194px}.stage{min-height:530px}}@media(max-width:780px){header{height:72px;padding:0 20px}.tag{display:none}.brand{font-size:23px}main{padding:30px 18px}.layout{grid-template-columns:1fr;gap:20px}h1{font-size:33px;letter-spacing:4px}.stage{min-height:420px;padding:34px 20px 25px}.number{font-size:144px}.panel{padding:22px}.intro p{font-size:16px}.history-head span{font-size:14px}}@media(prefers-reduced-motion:reduce){.petal{display:none}}
.number{font-family:"Microsoft JhengHei","微軟正黑體",sans-serif;font-size:28px;min-height:175px;display:flex;align-items:center;justify-content:center;gap:28px}.number strong{display:block;font:104px/1.1 "Microsoft JhengHei","微軟正黑體",sans-serif}.number small{display:block;font-size:17px;letter-spacing:4px;margin-top:10px}.ball{width:auto;min-width:110px;border-radius:24px;padding:0 16px;font-family:"Microsoft JhengHei","微軟正黑體",sans-serif;font-size:18px}.stage{border-radius:130px 130px 18px 18px}.batch-results{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:12px 0}.batch-results span{padding:7px 12px;border-radius:18px;background:#fff9;color:var(--pink);font-size:17px}@media(max-width:780px){.number strong{font-size:84px}.number{gap:22px}} body{font-size:20px}.eyebrow,footer{font-style:normal}html.presentation,html.presentation body{width:100%;height:100%;overflow:hidden}.presentation #fit-content{position:absolute;left:50%;top:50%;transform-origin:center center;width:var(--fit-width,1250px);transform:translate(-50%,-50%) scale(var(--fit-scale,1))}.presentation header{height:68px;max-width:none;padding:0 30px}.presentation main{max-width:1500px;padding:18px 30px 8px}.presentation .intro h1{margin:5px 0;font-size:42px}.presentation .intro p{margin:6px 0}.presentation .eyebrow{font-size:24px}.presentation .layout{margin-top:16px;gap:22px;grid-template-columns:minmax(0,1fr) 350px}.presentation .stage{min-height:0;padding:22px 25px 18px;border-radius:125px 125px 18px 18px;display:flex;flex-direction:column;align-items:center;justify-content:center}.presentation .number{min-height:150px;margin:0}.presentation .number strong{font-size:104px}.presentation .status{margin:4px 0 12px}.presentation .hint{margin-top:10px}.presentation .panel{padding:18px 22px}.presentation .sub{margin-bottom:12px;line-height:1.5}.presentation .field input{padding:7px}.presentation .field label{margin-bottom:4px}.presentation .apply{margin-top:10px;padding:8px}.presentation .error{margin-top:4px}.presentation .stats{margin-top:10px;padding-top:9px}.presentation .reset{margin-top:10px}.presentation .history{margin-top:14px;padding-top:12px}.presentation .history h2{margin-bottom:0}.presentation .balls{min-height:0;gap:7px;padding-top:10px}.presentation .ball{height:46px}.presentation footer{padding:12px}.header-actions{display:flex;align-items:center;justify-content:flex-end;gap:10px;flex-shrink:0}.home-link{text-decoration:none;font-family:inherit;font-size:18px;white-space:nowrap}.header-actions .outline{white-space:nowrap}header{gap:16px}.tag{flex:1;text-align:center}@media(max-width:1100px){header .tag{display:none}}@media(max-width:600px){header{height:auto;min-height:90px;flex-wrap:wrap;justify-content:center;padding:14px}.header-actions{gap:8px}.header-actions .outline{padding:8px 12px;font-size:16px}}</style></head><body><div id="fit-content"><header><div class="brand"><span>♡</span>幸福點名</div><div class="tag">A LITTLE LUCK, A LOT OF LOVE</div><div class="header-actions"><a class="outline home-link" href="https://amykao2023.github.io/wedding-games/">⌂ 回到遊戲入口</a><button class="outline" id="fullscreen">⛶ 全螢幕</button></div></header><main><section class="intro"><div class="eyebrow">Love, luck & happily ever after</div><h1>下一位幸運的你</h1><p>抽一張桌號，遇見一位幸運的賓客。</p></section><div class="layout"><section class="stage" aria-label="賓客抽獎"><div class="tiny">THE LUCKY GUEST</div><div id="number" class="number" aria-live="polite">♡</div><p class="status" id="status">準備好了嗎？下一個幸運號碼即將揭曉</p><button class="primary" id="draw">♡ 抽出幸運號碼</button><p class="hint">按空白鍵也可以抽號 · 先抽桌號 → 再抽座位 · 抽幾位由你決定</p></section><aside class="panel"><h2>今天的幸運賓客</h2><p class="sub">先抽桌號，再抽座位號碼，<br>桌號為 0(主桌)～19 桌，座位 1–10。</p><div class="range"><div class="field"><label for="min">起始桌號</label><input id="min" type="number" value="0" min="0" max="19"></div><span>—</span><div class="field"><label for="max">結束桌號</label><input id="max" type="number" value="19" min="0" max="19"></div></div><button class="apply" id="apply">套用設定</button><p class="error" role="alert" id="error"></p><div class="stats"><div><strong id="count">0</strong><span>已抽出</span></div><div><strong id="remaining">200</strong><span>待揭曉</span></div></div><button class="reset" id="reset">↻ 重新開始這一局</button></aside></div><section class="history"><div class="history-head"><h2>幸福足跡 <span>／ 已抽賓客</span></h2><span>最新抽中的賓客排在最前面</span></div><div class="balls" id="balls"></div></section></main><footer>Made for a day filled with love ♡</footer></div><script>
const $=id=>document.getElementById(id);let state={min:0,max:19,drawn:[],pending:null},busy=false;try{const s=JSON.parse(localStorage.getItem('wedding-guests-steps-v1'));if(s&&Number.isInteger(s.min)&&Number.isInteger(s.max)&&s.min>=0&&s.max<=999&&s.min<=s.max&&Array.isArray(s.drawn)&&new Set(s.drawn).size===s.drawn.length&&s.drawn.every(n=>Number.isInteger(n)&&((n>=0&&n<10)||(n>=s.min*10&&n<(s.max+1)*10)))&&(s.pending===null||Number.isInteger(s.pending)&&(s.pending===0||(s.pending>=s.min&&s.pending<=s.max))&&s.drawn.filter(n=>Math.floor(n/10)===s.pending).length<10))state=s}catch{}
state.min=0;state.max=19;state.drawn=state.drawn.filter(n=>n>=0&&n<200);if(state.pending!==null&&(state.pending<0||state.pending>19))state.pending=null;
const table=n=>Math.floor(n/10),seat=n=>n%10+1,tableName=t=>t===0?'主桌':t+' 桌',label=n=>tableName(table(n))+' · '+seat(n)+' 號';
const steps=document.createElement('div');steps.className='batch-results';$('status').before(steps);
function show(t,s){$('number').replaceChildren();for(const [value,title]of [[t===0?'主桌':t??'—','桌號'],[s??'—','座位號碼']]){const box=document.createElement('div'),big=document.createElement('strong'),small=document.createElement('small');big.textContent=value;small.textContent=title;box.append(big,small);$('number').append(box)}}
function seats(t){const used=new Set(state.drawn);return Array.from({length:10},(_,i)=>t*10+i).filter(n=>!used.has(n))}
function tables(){const all=seats(0).length?[0]:[];for(let t=Math.max(1,state.min);t<=state.max;t++)if(seats(t).length)all.push(t);return all}
function fitPresentation(){const active=!!document.fullscreenElement;document.documentElement.classList.toggle('presentation',active);const content=$('fit-content');if(!active){content.style.removeProperty('--fit-width');content.style.removeProperty('--fit-scale');return}const width=Math.max(1100,Math.min(1500,window.innerWidth-24));content.style.setProperty('--fit-width',width+'px');content.style.setProperty('--fit-scale','1');const scale=Math.min(1,(window.innerWidth-16)/width,(window.innerHeight-16)/content.scrollHeight);content.style.setProperty('--fit-scale',scale)}window.addEventListener('resize',()=>requestAnimationFrame(fitPresentation));
function render(){const left=(state.max-Math.max(1,state.min)+2)*10-state.drawn.length,last=state.drawn.at(-1);$('min').value=state.min;$('max').value=state.max;$('count').textContent=state.drawn.length;$('remaining').textContent=left;show(state.pending??(last===undefined?null:table(last)),state.pending!==null?null:last===undefined?null:seat(last));$('status').textContent=!left?'所有賓客都已抽出，謝謝大家 ♡':state.pending!==null?'桌號已揭曉！再按一次抽出這桌的座位號碼':last!==undefined?'恭喜這位幸運賓客！繼續抽出下一位吧':'先抽桌號，再抽座位，讓幸福慢慢揭曉';steps.replaceChildren();['01 抽桌號','02 抽座位'].forEach((txt,i)=>{const el=document.createElement('span');el.textContent=txt;if(i===(state.pending!==null?1:0)){el.style.background='var(--pink)';el.style.color='white'}steps.append(el)});$('draw').disabled=busy||!left;$('apply').disabled=busy;$('reset').disabled=busy;$('min').disabled=busy;$('max').disabled=busy;$('draw').textContent=busy?'幸福揭曉中…':!left?'本局已圓滿結束':state.pending!==null?'♡ 抽出座位號碼':'♡ 抽出幸運桌號';$('balls').replaceChildren();if(!state.drawn.length){const el=document.createElement('span');el.className='empty';el.textContent='第一位幸運賓客，即將揭曉…';$('balls').append(el)}else [...state.drawn].reverse().forEach(n=>{const el=document.createElement('span');el.className='ball';el.textContent=label(n);$('balls').append(el)});try{localStorage.setItem('wedding-guests-steps-v1',JSON.stringify(state))}catch{}requestAnimationFrame(fitPresentation)}
function randomIndex(length){const a=new Uint32Array(1),limit=Math.floor(4294967296/length)*length;do{crypto.getRandomValues(a)}while(a[0]>=limit);return a[0]%length}
function draw(){if(busy)return;const isSeat=state.pending!==null,pool=isSeat?seats(state.pending):tables();if(!pool.length)return;const picked=pool[randomIndex(pool.length)];busy=true;$('error').textContent='';render();let ticks=0;const timer=setInterval(()=>{const n=pool[randomIndex(pool.length)];show(isSeat?state.pending:n,isSeat?seat(n):null);if(++ticks>=12){clearInterval(timer);if(isSeat){state.drawn.push(picked);state.pending=null}else state.pending=picked;busy=false;render()}},65)}
$('draw').onclick=draw;$('apply').onclick=()=>{const a=$('min').value,b=$('max').value,min=Number(a),max=Number(b);if(!a||!b||!Number.isInteger(min)||!Number.isInteger(max)||min<0||max>19||min>max){$('error').textContent='桌號請輸入 0–19 的整數，起始不可大於結束。';return}if(min===state.min&&max===state.max){$('error').textContent='目前已使用這個桌號範圍。';return}if((state.drawn.length||state.pending!==null)&&!confirm('更改桌號範圍將清除本局紀錄，確定開始新的一局？'))return;state={min,max,drawn:[],pending:null};$('error').textContent='';render()};$('reset').onclick=()=>{if((state.drawn.length||state.pending!==null)&&confirm('確定清除本局紀錄，重新開始？')){state.drawn=[];state.pending=null;$('error').textContent='';render()}};document.addEventListener('keydown',e=>{if(e.code==='Space'&&!e.repeat&&!['INPUT','BUTTON','TEXTAREA','SELECT'].includes(document.activeElement.tagName)){e.preventDefault();draw()}});$('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{$('error').textContent='請使用瀏覽器的全螢幕功能。'}};document.addEventListener('fullscreenchange',()=>{$('fullscreen').textContent=document.fullscreenElement?'⛶ 離開全螢幕':'⛶ 全螢幕';requestAnimationFrame(fitPresentation)});render();
</script></body></html>
